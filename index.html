<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পিকনিক ফান্ড ম্যানেজার</title>
    <!-- ফন্ট অসম (Font Awesome) আইকনের জন্য -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #0a0a0c;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid var(--theme-color, #a800ff);
            box-shadow: 0 0 15px var(--theme-color, #a800ff), inset 0 0 10px rgba(168, 0, 255, 0.3);
            position: relative;
            transition: all 0.3s ease;
        }

        .card.rgb-active {
            animation: rgbGlow 6s linear infinite;
        }

        @keyframes rgbGlow {
            0% { border-color: #ff0055; box-shadow: 0 0 18px #ff0055, inset 0 0 10px rgba(255, 0, 85, 0.3); }
            25% { border-color: #ffee00; box-shadow: 0 0 18px #ffee00, inset 0 0 10px rgba(255, 238, 0, 0.3); }
            50% { border-color: #00ffd5; box-shadow: 0 0 18px #00ffd5, inset 0 0 10px rgba(0, 255, 213, 0.3); }
            75% { border-color: #7a00ff; box-shadow: 0 0 18px #7a00ff, inset 0 0 10px rgba(122, 0, 255, 0.3); }
            100% { border-color: #ff0055; box-shadow: 0 0 18px #ff0055, inset 0 0 10px rgba(255, 0, 85, 0.3); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .app-title {
            color: #ff007f;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 8px #ff007f;
        }

        .setting-icon-btn {
            background: #15151e;
            border: 1px solid #00ffd5;
            color: #00ffd5;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .grand-total {
            background: #15151e;
            border: 1px solid #00ffd5;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            color: #ffee00;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(0, 255, 213, 0.2);
        }

        .btn-add-member {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff0055, #00ffd5);
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
            margin-bottom: 20px;
        }

        .member-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .member-card {
            background: #111118;
            border: 1.5px solid #8a2be2;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .member-card:hover {
            border-color: #00ffd5;
            box-shadow: 0 0 8px #00ffd5;
        }

        .member-info-name {
            color: #00ffd5;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .member-info-total {
            color: #ffee00;
            font-weight: bold;
        }

        /* সোশ্যাল মিডিয়া ফুটার আইকন */
        .social-footer {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #222;
        }

        .social-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        .social-icon.facebook { background: #1877f2; }
        .social-icon.youtube { background: #ff0000; }
        .social-icon.tiktok { background: #000000; border: 1px solid #ff0055; }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .back-btn {
            background: transparent;
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .member-header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .member-header {
            color: #00ffd5;
            font-size: 1.2rem;
        }

        .edit-name-btn {
            background: #15151e;
            border: 1px solid #ffee00;
            color: #ffee00;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .member-subtotal {
            text-align: center;
            color: #ffee00;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #00ffd5;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1.5px solid #8a2be2;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .save-money-btn {
            width: 100%;
            padding: 10px;
            background: #00ffd5;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .history-item {
            background: #15151e;
            border-left: 3px solid #ff007f;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-date {
            font-size: 0.75rem;
            color: #888;
        }

        .delete-history-btn {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-history-btn:hover {
            background: #ff0055;
            color: #fff;
        }

        .setting-box {
            background: #111118;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 15px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .color-options {
            display: flex;
            gap: 10px;
        }

        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
        }

        .setting-member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0c;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid #444;
        }

        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <div class="top-bar">
        <div class="app-title" id="displayAppTitle">🌸 পিকনিক ফান্ডের হিসাব 🌸</div>
        <button class="setting-icon-btn" onclick="showPage('settingsPage')">⚙ সেটিং</button>
    </div>

    <!-- হোম পেজ: সদস্য তালিকা -->
    <div id="homePage" class="view active">
        <div class="grand-total" id="grandTotalDisplay">সর্বমোট জমা: ৳ ০</div>
        <button class="btn-add-member" onclick="addNewMember()">➕ নতুন সদস্য যোগ করুন</button>
        
        <ul class="member-list" id="memberList">
            <!-- সদস্যরা এখানে লোড হবে -->
        </ul>

        <!-- সোশ্যাল মিডিয়া লোগোগুলো -->
        <div class="social-footer">
            <a href="#" id="fbLink" target="_blank" class="social-icon facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" id="ytLink" target="_blank" class="social-icon youtube" title="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="#" id="ttLink" target="_blank" class="social-icon tiktok" title="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

    <!-- সদস্যের ব্যক্তিগত হিস্ট্রি ও টাকা যোগ করার পেজ -->
    <div id="detailPage" class="view">
        <button class="back-btn" onclick="showPage('homePage')">⬅ পেছনে যান</button>
        
        <div class="member-header-box">
            <div class="member-header" id="currentMemberName">সদস্যের নাম</div>
            <button class="edit-name-btn" onclick="editMemberName()">✏ নাম এডিট</button>
        </div>
        <div class="member-subtotal" id="currentMemberTotal">মোট জমা: ৳ ০</div>

        <div style="background: #111118; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333;">
            <div class="input-group">
                <label class="input-label">💰 নতুন টাকা যোগ করুন:</label>
                <input type="number" id="newAmountInput" class="input-field" placeholder="টাকার পরিমাণ লিখুন">
            </div>
            <button class="save-money-btn" onclick="addMoneyToMember()">[ 💾 টাকা জমা করুন ]</button>
        </div>

        <h4 style="color: #00ffd5; margin-bottom: 10px; font-size: 0.95rem;">📋 জমার ইতিহাস (History):</h4>
        <div id="memberHistoryList" style="max-height: 200px; overflow-y: auto;">
            <!-- ব্যক্তিগত হিস্ট্রি এখানে লোড হবে -->
        </div>
    </div>

    <!-- সেটিংস পেজ -->
    <div id="settingsPage" class="view">
        <button class="back-btn" onclick="showPage('homePage')">⬅ পেছনে যান</button>
        <h3 style="color: #00ffd5; margin-bottom: 15px;">⚙ অ্যাপ সেটিংস</h3>

        <!-- সোশ্যাল মিডিয়া লিংক আপডেট বক্স -->
        <div class="setting-box">
            <h4 style="color: #00ffd5; margin-bottom: 10px; font-size: 0.95rem;">🌐 সোশ্যাল মিডিয়া লিংক সেটআপ</h4>
            
            <div class="input-group">
                <label class="input-label">Facebook লিংক:</label>
                <input type="text" id="settingFbInput" class="input-field" placeholder="https://facebook.com/...">
            </div>

            <div class="input-group">
                <label class="input-label">YouTube লিংক:</label>
                <input type="text" id="settingYtInput" class="input-field" placeholder="https://youtube.com/...">
            </div>

            <div class="input-group">
                <label class="input-label">TikTok লিংক:</label>
                <input type="text" id="settingTtInput" class="input-field" placeholder="https://tiktok.com/...">
            </div>

            <button class="save-money-btn" onclick="updateSocialLinks()" style="margin-bottom:0;">[ 💾 লিংক আপডেট করুন ]</button>
        </div>

        <!-- সদস্য ম্যানেজমেন্ট / ডিলিট বক্স -->
        <div class="setting-box">
            <h4 style="color: #ff007f; margin-bottom: 10px; font-size: 0.95rem;">👤 সদস্য ডিলিট বা মাইনাস করুন</h4>
            <div id="settingsMemberList" style="max-height: 130px; overflow-y: auto; margin-top: 8px;"></div>
        </div>

        <!-- অ্যাপের নাম পরিবর্তন বক্স -->
        <div class="setting-box">
            <h4 style="color: #00ffd5; margin-bottom: 10px; font-size: 0.95rem;">✏ অ্যাপের নাম কাস্টমাইজ</h4>
            <div class="input-group">
                <label class="input-label">নতুন নাম লিখুন:</label>
                <input type="text" id="customTitleInput" class="input-field" placeholder="যেমন: পিকনিক ফান্ড ২০২৬">
            </div>
            <button class="save-money-btn" onclick="updateAppTitle()" style="margin-bottom:0;">[ 💾 নাম সেভ করুন ]</button>
        </div>

        <!-- পাসওয়ার্ড পরিবর্তনের বক্স -->
        <div class="setting-box">
            <h4 style="color: #ff007f; margin-bottom: 10px; font-size: 0.95rem;">🔒 পাসওয়ার্ড পরিবর্তন</h4>
            <div class="input-group">
                <label class="input-label">বর্তমান পাসওয়ার্ড:</label>
                <input type="password" id="oldPassInput" class="input-field" placeholder="পুরাতন পাসওয়ার্ড">
            </div>
            <div class="input-group">
                <label class="input-label">নতুন পাসওয়ার্ড:</label>
                <input type="password" id="newPassInput" class="input-field" placeholder="নতুন পাসওয়ার্ড">
            </div>
            <button class="save-money-btn" onclick="changePassword()" style="margin-bottom:0;">[ 🔑 পাসওয়ার্ড আপডেট ]</button>
        </div>

        <!-- থিম ও RGB লাইটিং বক্স -->
        <div class="setting-box">
            <div class="setting-row">
                <span style="font-size: 0.9rem; color: #00ffd5;">🌈 RGB নিওন লাইট:</span>
                <input type="checkbox" id="rgbToggle" onchange="toggleRGB(this.checked)" style="width: 20px; height: 20px; cursor: pointer;">
            </div>

            <div class="setting-row" style="margin-top: 15px; margin-bottom: 0;">
                <span style="font-size: 0.9rem; color: #00ffd5;">🎨 বর্ডার কালার:</span>
                <div class="color-options">
                    <div class="color-dot" style="background: #a800ff;" onclick="setThemeColor('#a800ff')"></div>
                    <div class="color-dot" style="background: #00ffd5;" onclick="setThemeColor('#00ffd5')"></div>
                    <div class="color-dot" style="background: #ff007f;" onclick="setThemeColor('#ff007f')"></div>
                    <div class="color-dot" style="background: #ffee00;" onclick="setThemeColor('#ffee00')"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ⚙ মাস্টার ডাটা কনফিগারেশন (কোডের ভেতরে স্থায়ী ব্যাকআপ)
    // আপনি চাইলে এখানে মেম্বার, হিস্ট্রি, পাসওয়ার্ড এবং সোশ্যাল লিংক ফিক্সড করে দিতে পারেন।
    // গিটহাবে কোড আপডেট করলেই যেকোনো নতুন ফোনে এই ডাটাগুলো সাথে সাথে চলে আসবে।
    // ==========================================
    const MASTER_CONFIG = {
        appTitle: "🌸 পিকনিক ফান্ডের হিসাব 🌸",
        appPass: "1234",
        rgbActive: false,
        themeColor: "#a800ff",
        fbLink: "https://facebook.com",
        ytLink: "https://youtube.com",
        ttLink: "https://tiktok.com",
        members: [
            {
                id: 1,
                name: "Md Musa Khan",
                history: [
                    { id: 101, amount: 500, dateTime: "১ জুন ২০২৬ | ১০:০০ AM" }
                ]
            },
            {
                id: 2,
                name: "সদস্য ২",
                history: [
                    { id: 102, amount: 300, dateTime: "১ জুন ২০২৬ | ১০:০৫ AM" }
                ]
            }
        ]
    };

    // যদি প্রথমবার হয় অথবা রিসেট করতে চান, তবে মাস্টার কনফিগারেশন লোড হবে
    function getAppData() {
        let saved = localStorage.getItem('picnic_master_data_v3');
        if (!saved) {
            localStorage.setItem('picnic_master_data_v3', JSON.stringify(MASTER_CONFIG));
            return MASTER_CONFIG;
        }
        return JSON.parse(saved);
    }

    function saveAppData(data) {
        localStorage.setItem('picnic_master_data_v3', JSON.stringify(data));
    }

    let activeMemberId = null;

    document.addEventListener("DOMContentLoaded", () => {
        loadSettings();
        renderMemberList();
    });

    function showPage(pageId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        if(pageId === 'homePage') {
            renderMemberList();
        } else if(pageId === 'settingsPage') {
            renderSettingsMemberList();
            loadSettingsInputValues();
        }
    }

    async function authenticateUser() {
        let appData = getAppData();
        let currentPass = appData.appPass || "1234";

        const inputPass = prompt("সিকিউরিটি পাসওয়ার্ড দিন:");
        if (inputPass === currentPass) {
            return true;
        } else {
            if(inputPass !== null) alert("ভুল পাসওয়ার্ড!");
            return false;
        }
    }

    function changePassword() {
        let appData = getAppData();
        const oldP = document.getElementById('oldPassInput').value;
        const newP = document.getElementById('newPassInput').value.trim();

        if (oldP !== appData.appPass) {
            alert("বর্তমান পাসওয়ার্ডটি ভুল হয়েছে!");
            return;
        }

        if (!newP) {
            alert("নতুন পাসওয়ার্ডটি ফাঁকা রাখা যাবে না!");
            return;
        }

        appData.appPass = newP;
        saveAppData(appData);

        document.getElementById('oldPassInput').value = '';
        document.getElementById('newPassInput').value = '';
        alert("পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!");
        showPage('homePage');
    }

    function updateAppTitle() {
        let appData = getAppData();
        const titleInput = document.getElementById('customTitleInput').value.trim();
        if (!titleInput) {
            alert("নাম ফাঁকা রাখা যাবে না!");
            return;
        }
        appData.appTitle = titleInput;
        saveAppData(appData);

        document.getElementById('displayAppTitle').innerText = titleInput;
        document.getElementById('customTitleInput').value = '';
        alert("অ্যাপের নাম সফলভাবে আপডেট করা হয়েছে!");
        showPage('homePage');
    }

    function updateSocialLinks() {
        let appData = getAppData();
        appData.fbLink = document.getElementById('settingFbInput').value.trim();
        appData.ytLink = document.getElementById('settingYtInput').value.trim();
        appData.ttLink = document.getElementById('settingTtInput').value.trim();
        saveAppData(appData);

        applySocialLinks();
        alert("সোশ্যাল মিডিয়া লিংকগুলো সফলভাবে সেভ করা হয়েছে!");
        showPage('homePage');
    }

    function applySocialLinks() {
        let appData = getAppData();
        document.getElementById('fbLink').href = appData.fbLink || '#';
        document.getElementById('ytLink').href = appData.ytLink || '#';
        document.getElementById('ttLink').href = appData.ttLink || '#';
    }

    function loadSettingsInputValues() {
        let appData = getAppData();
        document.getElementById('settingFbInput').value = appData.fbLink || '';
        document.getElementById('settingYtInput').value = appData.ytLink || '';
        document.getElementById('settingTtInput').value = appData.ttLink || '';
    }

    async function addNewMember() {
        const authenticated = await authenticateUser();
        if (!authenticated) return;

        const name = prompt("নতুন সদস্যের নাম লিখুন:");
        if (!name || name.trim() === "") return;

        let appData = getAppData();
        const newMember = {
            id: Date.now(),
            name: name.trim(),
            history: []
        };

        appData.members.push(newMember);
        saveAppData(appData);
        renderMemberList();
    }

    function renderSettingsMemberList() {
        const settingsListEl = document.getElementById('settingsMemberList');
        let appData = getAppData();

        settingsListEl.innerHTML = '';

        if (appData.members.length === 0) {
            settingsListEl.innerHTML = '<div style="text-align:center; color:#888; font-size:0.85rem;">কোনো সদস্য নেই।</div>';
            return;
        }

        appData.members.forEach(member => {
            const div = document.createElement('div');
            div.className = 'setting-member-item';
            div.innerHTML = `
                <span style="color: #00ffd5; font-size: 0.9rem;">👤 ${member.name}</span>
                <button class="delete-history-btn" onclick="deleteMemberFromSettings(${member.id})">❌ ডিলিট</button>
            `;
            settingsListEl.appendChild(div);
        });
    }

    async function deleteMemberFromSettings(memberId) {
        const authenticated = await authenticateUser();
        if (!authenticated) return;

        if (!confirm("আপনি কি নিশ্চিতভাবে এই সদস্যকে তালিকা থেকে মুছে ফেলতে চান?")) return;

        let appData = getAppData();
        appData.members = appData.members.filter(m => m.id !== memberId);
        saveAppData(appData);

        renderSettingsMemberList();
        renderMemberList();
    }

    async function editMemberName() {
        const authenticated = await authenticateUser();
        if (!authenticated) return;

        let appData = getAppData();
        const member = appData.members.find(m => m.id === activeMemberId);
        if (!member) return;

        const newName = prompt("সদস্যের নতুন নাম লিখুন:", member.name);
        if (!newName || newName.trim() === "") return;

        member.name = newName.trim();
        saveAppData(appData);
        renderMemberDetail();
        alert("নাম সফলভাবে আপডেট করা হয়েছে!");
    }

    function renderMemberList() {
        const listEl = document.getElementById('memberList');
        const grandTotalEl = document.getElementById('grandTotalDisplay');
        let appData = getAppData();

        listEl.innerHTML = '';
        let grandTotal = 0;

        if (appData.members.length === 0) {
            listEl.innerHTML = '<li style="text-align:center; color:#888; margin-top:20px;">কোনো সদস্য যোগ করা হয়নি।</li>';
            grandTotalEl.innerText = 'সর্বমোট জমা: ৳ ০';
            return;
        }

        appData.members.forEach(member => {
            const memberTotal = member.history.reduce((sum, item) => sum + item.amount, 0);
            grandTotal += memberTotal;

            const li = document.createElement('li');
            li.className = 'member-card';
            li.onclick = () => {
                activeMemberId = member.id;
                showPage('detailPage');
                renderMemberDetail();
            };
            li.innerHTML = `
                <span class="member-info-name">👤 ${member.name}</span>
                <span class="member-info-total">৳ ${memberTotal}</span>
            `;
            listEl.appendChild(li);
        });

        grandTotalEl.innerText = `সর্বমোট জমা: ৳ ${grandTotal}`;
    }

    function renderMemberDetail() {
        let appData = getAppData();
        const member = appData.members.find(m => m.id === activeMemberId);

        if (!member) return;

        document.getElementById('currentMemberName').innerText = `👤 ${member.name}`;
        
        const total = member.history.reduce((sum, item) => sum + item.amount, 0);
        document.getElementById('currentMemberTotal').innerText = `মোট জমা: ৳ ${total}`;

        const historyListEl = document.getElementById('memberHistoryList');
        historyListEl.innerHTML = '';

        if (member.history.length === 0) {
            historyListEl.innerHTML = '<div style="text-align:center; color:#777;">এখনো কোনো টাকা জমা করা হয়নি।</div>';
            return;
        }

        member.history.slice().reverse().forEach((item) => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div>
                    <div style="color: #fff; font-weight: bold; font-size: 0.9rem;">+ ৳ ${item.amount}</div>
                    <div class="history-date">📅 ${item.dateTime}</div>
                </div>
                <button class="delete-history-btn" onclick="deleteHistoryEntry(${item.id})">❌ ডিলিট</button>
            `;
            historyListEl.appendChild(div);
        });
    }

    async function deleteHistoryEntry(historyId) {
        const authenticated = await authenticateUser();
        if (!authenticated) return;

        if (!confirm("আপনি কি নিশ্চিতভাবে এই হিস্ট্রি বা এন্ট্রিটি মুছে ফেলতে চান?")) return;

        let appData = getAppData();
        const member = appData.members.find(m => m.id === activeMemberId);

        if (member) {
            member.history = member.history.filter(item => item.id !== historyId);
            saveAppData(appData);
            renderMemberDetail();
        }
    }

    function addMoneyToMember() {
        const amountInput = document.getElementById('newAmountInput');
        const amount = parseFloat(amountInput.value);

        if (isNaN(amount) || amount <= 0) {
            alert("সঠিক টাকার পরিমাণ লিখুন!");
            return;
        }

        let appData = getAppData();
        const memberIndex = appData.members.findIndex(m => m.id === activeMemberId);

        if (memberIndex !== -1) {
            const now = new Date();
            const dateStr = now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });

            const newHistoryEntry = {
                id: Date.now(),
                amount: amount,
                dateTime: `${dateStr} | ${timeStr}`
            };

            appData.members[memberIndex].history.push(newHistoryEntry);
            saveAppData(appData);

            amountInput.value = '';
            renderMemberDetail();
        }
    }

    function toggleRGB(enabled) {
        let appData = getAppData();
        appData.rgbActive = enabled;
        saveAppData(appData);

        const card = document.getElementById('mainCard');
        if(enabled) {
            card.classList.add('rgb-active');
        } else {
            card.classList.remove('rgb-active');
        }
    }

    function setThemeColor(color) {
        let appData = getAppData();
        appData.themeColor = color;
        saveAppData(appData);

        document.documentElement.style.setProperty('--theme-color', color);
    }

    function loadSettings() {
        let appData = getAppData();
        
        document.getElementById('rgbToggle').checked = appData.rgbActive;
        toggleRGB(appData.rgbActive);
        setThemeColor(appData.themeColor);
        document.getElementById('displayAppTitle').innerText = appData.appTitle;
        applySocialLinks();
    }
</script>

</body>
</html>
